[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moodgraph"
version = "1.0.0"
description = "MoodGraph — Hệ Thống Gợi Ý Điện Ảnh Dựa Trên Đồ Thị Tri Thức & Học Máy Phân Tán"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pyspark>=3.5.0,<4.3.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "networkx>=3.2.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

# ==============================================================================
# Code Style & Formatter: Black
# ==============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.ruff_cache
  | \.trash_archive
  | data
  | artifacts
  | tmp
  | build
  | dist
)/
'''

# ==============================================================================
# Linter & Import Sorter: Ruff
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".trash_archive",
    "data",
    "artifacts",
    "tmp",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length violations (enforced via black/formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["recommender", "scripts", "tests"]

# ==============================================================================
# Automated Testing: Pytest
# ==============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests focusing on mathematical formulas and isolated logic",
    "integration: Integration tests between API, services, and repositories",
    "als: PySpark ALS distributed collaborative filtering tests",
    "kg: Knowledge graph tests (Metapaths P1-P3, PageRank, Subgraph)",
    "hybrid: Hybrid recommender fusion tests (RRF, Min-Max Weighted)",
    "api: FastAPI endpoint tests",
]
